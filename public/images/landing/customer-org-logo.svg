<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="orgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <!-- Shield Background -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#orgGrad)" />
  <rect x="10" y="10" width="100" height="100" rx="24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  
  <!-- Laurel / Wreath & Star Accent -->
  <circle cx="60" cy="28" r="4" fill="url(#goldGrad)" />
  <path d="M 40 38 Q 30 55 42 75 Q 46 82 60 88 Q 74 82 78 75 Q 90 55 80 38" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Graduation Cap -->
