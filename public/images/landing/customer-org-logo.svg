  <circle cx="85" cy="75" r="2.5" fill="url(#goldGrad)"/>

  <!-- Open Book Base -->
  <path d="M 40 76 Q 60 73 60 78 Q 60 73 80 76 L 78 86 Q 60 83 60 88 Q 60 83 42 86 Z" fill="url(#goldGrad)"/>
