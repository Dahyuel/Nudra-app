name: nudra-test
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nudra_test
      POSTGRES_PASSWORD: qa-disposable-only
    ports: ["127.0.0.1:15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nudra_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: qa-minio
      MINIO_ROOT_PASSWORD: qa-disposable-only
    ports: ["127.0.0.1:19001:9000"]
