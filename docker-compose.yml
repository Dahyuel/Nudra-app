services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nudra-postgres
    restart: unless-stopped
    environment:
      # IMPORTANT: set these in your .env file, never commit real secrets
      POSTGRES_DB: ${POSTGRES_DB:-nudra}
      POSTGRES_USER: ${POSTGRES_USER:-nudra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nudra-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: elestio/minio
    container_name: nudra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # IMPORTANT: set these in your .env file, never commit real secrets
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama
    container_name: nudra_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVER_PID=$$!
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull nomic-embed-text
        wait $$SERVER_PID

  mailpit:
    image: axllent/mailpit
    container_name: nudra_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  whisper:
    build: ./workers/whisper
    container_name: nudra_whisper
    restart: unless-stopped
    expose:
      - "5001"
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nudra_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-nudra_minio_secret}
      # Must equal WHISPER_API_KEY in backend/.env (the backend sends it as X-API-Key).
      WHISPER_API_KEY: ${WHISPER_API_KEY:?set WHISPER_API_KEY in .env to the same value as backend/.env}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
