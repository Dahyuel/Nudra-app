name: nudra-production

x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?set POSTGRES_MIGRATION_USER}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?set POSTGRES_MIGRATION_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init/10-create-app-roles.sh:/docker-entrypoint-initdb.d/10-create-app-roles.sh:ro
    networks:
      data:
        ipv4_address: 172.29.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 0.75
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      data:
        ipv4_address: 172.29.0.3
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    mem_limit: 384m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  minio:
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    logging: *bounded-logging
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    networks:
      storage:
        ipv4_address: 172.30.0.2
    mem_limit: 1g
    cpus: 0.35
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    logging: *bounded-logging
    restart: "no"
    entrypoint: ["/bin/sh", "/infra/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:?set MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
      MINIO_BUCKET_PREFIX: ${MINIO_BUCKET_PREFIX:-nudra}
    volumes:
      - ./infra/minio-init.sh:/infra/minio-init.sh:ro
      - ./infra/minio-app-policy.json:/policies/nudra-app.json:ro
      - ./infra/minio-app-policy-demo.json:/policies/nudra-demo-app.json:ro
    networks:
      - storage
    depends_on:
      - minio
    mem_limit: 192m
    cpus: 0.15
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *bounded-logging
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    stop_grace_period: 30s
    env_file:
      - .env.production.api
    environment:
      NODE_ENV: production
      PORT: "3001"
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN}
      ASSETS_HOST: ${ASSETS_HOST:?set ASSETS_HOST}
      PUBLIC_IPV4: ${PUBLIC_IPV4:?set PUBLIC_IPV4}
      TRUST_PROXY: 172.28.0.2/32
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the runtime-role URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_APP_USER:?set MINIO_APP_USER}
      MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
      PUBLIC_STORAGE_URL: https://${ASSETS_HOST:?set ASSETS_HOST}/storage
      MINIO_BUCKET_PREFIX: ${MINIO_BUCKET_PREFIX:-nudra}
      DOMAIN_AUTH_SHARED_SECRET: ${DOMAIN_AUTH_SHARED_SECRET:?set DOMAIN_AUTH_SHARED_SECRET}
      ALLOWED_ORIGINS: https://${BASE_DOMAIN:?set BASE_DOMAIN},https://www.${BASE_DOMAIN:?set BASE_DOMAIN}
    networks:
      web:
        ipv4_address: 172.28.0.3
      data:
        ipv4_address: 172.29.0.4
      storage:
        ipv4_address: 172.30.0.3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    cpus: 0.65
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  video-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *bounded-logging
    restart: unless-stopped
    command: ["node", "dist/workers/transcodeWorker.js"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "dist/scripts/worker-health.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env.production.worker
    environment:
      NODE_ENV: production
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the runtime-role URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_APP_USER:?set MINIO_APP_USER}
      MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
      PUBLIC_STORAGE_URL: https://${ASSETS_HOST:?set ASSETS_HOST}/storage
      TRANSCODE_CONCURRENCY: "1"
      MINIO_BUCKET_PREFIX: ${MINIO_BUCKET_PREFIX:-nudra}
    networks:
      data:
        ipv4_address: 172.29.0.5
      storage:
        ipv4_address: 172.30.0.4
      outbound:
        ipv4_address: 172.31.0.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 1.0
    read_only: true
    volumes:
      - worker_tmp:/tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    logging: *bounded-logging
    restart: unless-stopped
    networks:
      web:
        ipv4_address: 172.28.0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.2
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  domain-auth:
    build:
      context: .
      dockerfile: infra/domain-auth.Dockerfile
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      DOMAIN_AUTH_SHARED_SECRET: ${DOMAIN_AUTH_SHARED_SECRET:?set DOMAIN_AUTH_SHARED_SECRET}
      API_INTERNAL_URL: http://api:3001
    networks:
      web:
        ipv4_address: 172.28.0.4
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.1
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN}
      ASSETS_HOST: ${ASSETS_HOST:?set ASSETS_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      web:
        ipv4_address: 172.28.0.2
      storage:
        ipv4_address: 172.30.0.5
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      domain-auth:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.3
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  data:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  storage:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  outbound:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  worker_tmp:
